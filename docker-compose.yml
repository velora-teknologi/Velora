services:
  postgres:
    image: postgres:16-alpine
    container_name: velora-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: velora_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - velora-network

  redis:
    image: redis:7-alpine
    container_name: velora-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - velora-network

  nats:
    image: nats:latest
    container_name: velora-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: -js -sd /data
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nats-server", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - velora-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velora-backend
    environment:
      PORT: 8080
      ENVIRONMENT: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: velora_dev
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: dev-secret-key
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - velora-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: velora-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:8080/api/v1
    depends_on:
      - backend
    networks:
      - velora-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nats_data:

networks:
  velora-network:
    driver: bridge
